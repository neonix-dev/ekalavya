<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M32 live</title>
<style>
  :root { --bg: #000; --surface: #16171A; --raised: #202226; --line: #2C2E33; --ink: #F2F3F5; --mute: #8E929B; --dim: #55575D;
          --accent: #C6F432; --on-accent: #0B0C0E; --warn: #FF9F0A; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font: 500 14px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif;
         display: grid; grid-template-rows: auto auto 1fr; gap: 10px; padding: 12px 16px; box-sizing: border-box; }
  header { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  h1 { margin: 0; font: 600 22px -apple-system, "SF Pro Display", sans-serif; letter-spacing: -.02em; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
  .dot::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.ok::before { background: #34C759; }
  button { font: 600 13px -apple-system, sans-serif; background: var(--raised); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: .4em 1em; cursor: pointer; }
  button.go { background: var(--accent); color: var(--on-accent); border: 0; }
  #learnbar { min-height: 28px; display: flex; align-items: center; gap: 12px; }
  #learnbar b { color: var(--accent); font-size: 16px; }
  #panel { width: 100%; height: auto; max-height: 62vh; display: block; }
  .ctl { cursor: pointer; } .ctl:hover rect, .ctl:hover circle { stroke: var(--accent); }
  .ctl.learning rect, .ctl.learning circle { stroke: var(--accent); stroke-width: 3; animation: blink .5s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .4; } }
  #below { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; min-height: 0; }
  .box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; overflow: auto; min-height: 0; }
  .box table { width: 100%; border-collapse: collapse; font: 12px/1.5 "SF Mono", ui-monospace, Menlo, monospace; }
  .box td { padding: 1px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; } .box td.k { color: var(--mute); }
  .box tr.flash td { color: var(--accent); }
  #log td { color: var(--mute); } #log tr:first-child td { color: var(--ink); }
</style>
</head>
<body>
<header>
  <h1>KOMPLETE KONTROL M32 · live</h1>
  <span class="dot" id="mdot">MIDI: click the page to connect</span>
  <span class="label" id="mode"></span>
  <span style="flex:1"></span>
  <button id="sysex">also listen to SysEx</button>
  <button id="clear">forget the calibration</button>
  <a href="./" style="color:var(--mute)">← avartan</a>
</header>
<div id="learnbar"><span class="label">calibrate</span><span id="learn">click any control on the drawing, then move or press it on the M32: it learns which message is which.</span></div>
<div>
  <svg id="panel" viewBox="0 0 1000 380"></svg>
  <div id="below" style="height:24vh;margin-top:10px">
    <div class="box"><div class="label">what it sends that is not placed yet</div><table id="unplaced"></table></div>
    <div class="box"><div class="label">placed (the calibration)</div><table id="placed"></table></div>
    <div class="box"><div class="label">every message, newest first</div><table id="log"></table></div>
  </div>
</div>
<script>
// The whole M32, live: every MIDI message it sends lights its control. What is not placed yet is listed; click a
// control and move it to place it. The map is kept in the kernel (/ensemble/m32map) for avartan to use.
// The M32's own screens and button lights speak NI's protocol, not MIDI: a browser cannot reach them.
const $ = (id) => document.getElementById(id);
const KERNEL = new URLSearchParams(location.search).get("kernel")
  || (/^(localhost|127\.)/.test(location.hostname) ? "" : "http://localhost:8300");      // ?kernel= for a test kernel
const kp = (p) => KERNEL ? KERNEL + "/ensemble/" + p : p;       // served by the kernel: relative; served by ekalavya.studio: this Mac's kernel

const NOTE = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
// the controls as drawn: [id, label, kind, x, y, w, h]
const C = [];
const btn = (id, label, x, y, w = 56, h = 26) => C.push([id, label, "btn", x, y, w, h]);
["shift", "scale", "arp", "undo", "quantize", "auto"].forEach((id, i) => btn(id, id, 22 + (i % 2) * 64, 22 + Math.floor(i / 2) * 34));
["loop", "rew", "ffw", "play", "rec", "stop"].forEach((id, i) => btn(id, {rew: "◀◀", ffw: "▶▶", play: "▶", rec: "●", stop: "■"}[id] || id, 22 + (i % 3) * 43, 136 + Math.floor(i / 3) * 34, 38));
btn("oct-", "oct −", 22, 216, 56); btn("oct+", "oct +", 86, 216, 56);
["browser", "plugin", "mixer", "instance", "midi", "setup"].forEach((id, i) => btn(id, id, 250 + i * 50, 112, 46, 22));
for (let k = 1; k <= 8; k++) C.push(["knob." + k, String(k), "knob", 590 + (k - 1) * 46, 52, 18, 0]);
C.push(["enc.turn", "4-D", "knob", 948, 52, 22, 0]);
["enc.push", "enc.up", "enc.down", "enc.left", "enc.right"].forEach((id, i) => btn(id, ["push", "↑", "↓", "←", "→"][i], 900 + (i % 3) * 32, 92 + Math.floor(i / 3) * 26, 28, 22));
C.push(["strip.pitch", "pitch", "strip", 26, 262, 46, 104], ["strip.mod", "mod", "strip", 88, 262, 46, 104]);
const LOW = {note: 53};                           // the lowest key shown: F3 until the M32 tells us (octave buttons move it)
let map = {}, val = {}, flash = {}, unplaced = {}, learning = null, log = [];

function draw() {
  const now = performance.now(), on = (id) => now - (flash[id] || 0) < 250;
  let s = `<rect x="4" y="4" width="992" height="372" rx="16" fill="#111214" stroke="#2C2E33"/>`;
  s += `<rect x="250" y="22" width="296" height="80" rx="6" fill="#050506" stroke="#2C2E33"/><text x="398" y="50" fill="#55575D" font-size="11" text-anchor="middle">the M32's screens (NI's protocol: not reachable)</text>
        <text x="398" y="80" fill="#F2F3F5" font-size="15" text-anchor="middle" font-family="SF Mono, Menlo, monospace">${last ? last : "—"}</text>`;
  for (const [id, label, kind, x, y, w, h] of C) {
    const lit = on(id), placed = Object.values(map).includes(id) || (id === "strip.pitch") || (id === "strip.mod"), cls = "ctl" + (learning === id ? " learning" : "");
    if (kind === "btn") s += `<g class="${cls}" data-id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${lit ? "#C6F432" : "#202226"}" stroke="${placed ? "#55575D" : "#2C2E33"}" stroke-dasharray="${placed ? "" : "3 3"}"/>
          <text x="${x + w / 2}" y="${y + h / 2 + 4}" font-size="10.5" text-anchor="middle" fill="${lit ? "#0B0C0E" : placed ? "#F2F3F5" : "#8E929B"}">${label}</text></g>`;
    if (kind === "knob") {
      const v = val[id] || 0, a = -225 + (((v % 270) + 270) % 270), r = w, rad = a * Math.PI / 180;
      s += `<g class="${cls}" data-id="${id}"><circle cx="${x}" cy="${y}" r="${r}" fill="#202226" stroke="${lit ? "#C6F432" : placed ? "#55575D" : "#2C2E33"}" stroke-width="2" stroke-dasharray="${placed ? "" : "3 3"}"/>
            <line x1="${x}" y1="${y}" x2="${x + r * .8 * Math.cos(rad)}" y2="${y + r * .8 * Math.sin(rad)}" stroke="${lit ? "#C6F432" : "#F2F3F5"}" stroke-width="2.5" stroke-linecap="round"/>
            <text x="${x}" y="${y + r + 14}" font-size="10.5" text-anchor="middle" fill="#8E929B">${label}</text></g>`;
    }
    if (kind === "strip") {
      const v = val[id] === undefined ? (id === "strip.pitch" ? .5 : 0) : val[id];
      s += `<g class="${cls}" data-id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="#202226" stroke="${lit ? "#C6F432" : "#2C2E33"}"/>
            <rect x="${x + 4}" y="${y + h - 6 - v * (h - 12)}" width="${w - 8}" height="6" rx="3" fill="${lit ? "#C6F432" : "#F2F3F5"}"/>
            <text x="${x + w / 2}" y="${y - 5}" font-size="10.5" text-anchor="middle" fill="#8E929B">${label}</text></g>`;
    }
  }
  // the 32 keys
  const X0 = 150, W = 834, white = [], isB = (m) => [1, 3, 6, 8, 10].includes(m % 12);
  for (let m = LOW.note; m < LOW.note + 32; m++) if (!isB(m)) white.push(m);
  const ww = W / white.length;
  for (const pass of [0, 1]) for (let m = LOW.note; m < LOW.note + 32; m++) {
    if (isB(m) !== !!pass) continue;
    const x = pass ? X0 + white.indexOf(m - 1) * ww + ww * .68 : X0 + white.indexOf(m) * ww, w = pass ? ww * .64 : ww - 2, h = pass ? 66 : 108;
    const v = keysDown[m];
    s += `<rect x="${x}" y="258" width="${w}" height="${h}" rx="3" fill="${v ? `rgba(198,244,50,${.35 + v * .65})` : pass ? "#1a1b1e" : "#d9dadc"}"/>`;
    if (!pass && m % 12 === 0) s += `<text x="${x + w / 2}" y="358" font-size="10" text-anchor="middle" fill="#55575D">C${Math.floor(m / 12) - 1}</text>`;
  }
  $("panel").innerHTML = s;
}
let last = "", keysDown = {};

// MIDI
let midiOk = false;
async function connect(sysex = false) {
  if (!navigator.requestMIDIAccess) { $("mdot").textContent = "this browser has no MIDI"; return; }
  try {
    const acc = await navigator.requestMIDIAccess({sysex});
    const bind = () => { const names = []; acc.inputs.forEach(i => { if (/pico/i.test(i.name)) return; i.onmidimessage = (m) => heard(m.data, i.name); names.push(i.name); });
                         $("mdot").textContent = names.length ? "MIDI: " + names.join(", ") : "MIDI: no keyboard seen"; $("mdot").className = "dot" + (names.length ? " ok" : ""); };
    bind(); acc.onstatechange = bind; midiOk = true;
  } catch (e) { $("mdot").textContent = "MIDI not allowed (" + e.name + "): allow it in the address bar's site settings"; }
}
addEventListener("pointerdown", () => { if (!midiOk) connect(); }, {once: false});
$("sysex").onclick = () => connect(true);

function keyOf(d) {                               // a message's identity, for the map: kind.channel.number
  const st = d[0], ch = st & 15, k = st & 0xf0;
  if (st === 0xf0) return "sysex." + Array.from(d.slice(1, 5)).map(x => x.toString(16)).join("");
  if (k === 0xb0) return `cc.${ch}.${d[1]}`;
  if (k === 0x90 || k === 0x80) return `note.${ch}.${d[1]}`;
  if (k === 0xe0) return `bend.${ch}`;
  if (k === 0xc0) return `pc.${ch}.${d[1]}`;
  if (k === 0xd0) return `press.${ch}`;
  if (k === 0xa0) return `poly.${ch}.${d[1]}`;
  if (st >= 0xf8) return "clock." + st.toString(16);
  return "other." + st.toString(16);
}
function heard(d, from) {
  if (d[0] === 0xf8 || d[0] === 0xfe) return;    // clock and active sensing: not a hand
  const key = keyOf(d), k = d[0] & 0xf0, t = new Date().toLocaleTimeString();
  last = Array.from(d.slice(0, 8)).map(x => x.toString(16).padStart(2, "0")).join(" ");
  log.unshift([t, key, last]); log = log.slice(0, 40);
  if (learning && !(k === 0x80 || (k === 0x90 && d[2] === 0))) {      // place it: the control being taught takes this message
    for (const m of Object.keys(map)) if (map[m] === learning) delete map[m];
    map[key] = learning; delete unplaced[key]; flash[learning] = performance.now();
    $("learn").innerHTML = `<b>${learning}</b> is <b>${key}</b>. Click the next control.`; learning = null; save();
  }
  const id = map[key];
  if (id) {
    flash[id] = performance.now();
    if (k === 0xb0) {                              // a knob: absolute (0-127) or relative (1..63 up, 65..127 down)
      const v = d[2], rel = v < 16 || v > 112 ? (v < 64 ? v : v - 128) : null;
      val[id] = rel !== null && (map["rel." + key] || rel) ? (val[id] || 0) + rel * 6 : v / 127 * 270;
    }
    if (k === 0xe0 && id.startsWith("strip")) val[id] = ((d[2] << 7) | d[1]) / 16383;
  } else if (k === 0x90 || k === 0x80) {           // keys
    if (k === 0x90 && d[2] > 0) { keysDown[d[1]] = d[2] / 127; if (d[1] < LOW.note) LOW.note = d[1] - (d[1] % 12) + 5 - (d[1] % 12 < 5 ? 12 : 0); if (d[1] >= LOW.note + 32) LOW.note = d[1] - 31; }
    else delete keysDown[d[1]];
  } else if (k === 0xe0) { val["strip.pitch"] = ((d[2] << 7) | d[1]) / 16383; flash["strip.pitch"] = performance.now(); }
  else if (k === 0xb0 && d[1] === 1) { val["strip.mod"] = d[2] / 127; flash["strip.mod"] = performance.now(); }
  else { unplaced[key] = (unplaced[key] || 0) + 1; unplaced[key + ".v"] = d[2]; }
  tables();
}
function tables() {
  $("unplaced").innerHTML = Object.keys(unplaced).filter(k => !k.endsWith(".v")).map(k => `<tr><td>${k}</td><td class="k">×${unplaced[k]}</td><td class="k">last ${unplaced[k + ".v"] ?? ""}</td></tr>`).join("")
    || `<tr><td class="k">nothing yet: move a knob, press a button</td></tr>`;
  $("placed").innerHTML = Object.entries(map).map(([k, v]) => `<tr><td>${v}</td><td class="k">${k}</td></tr>`).join("") || `<tr><td class="k">keys, pitch and mod are known; the rest is taught here</td></tr>`;
  $("log").innerHTML = log.map(([t, k, raw]) => `<tr><td>${t}</td><td>${k}</td><td>${raw}</td></tr>`).join("");
}
$("panel").addEventListener("click", (e) => {
  const g = e.target.closest(".ctl"); if (!g) return;
  learning = g.dataset.id; $("learn").innerHTML = `now move or press <b>${learning}</b> on the M32`;
});
function save() { fetch(kp("m32map"), {method: "POST", body: JSON.stringify(map)}).catch(() => {}); try { localStorage.setItem("m32map", JSON.stringify(map)); } catch (_) {} }
$("clear").onclick = () => { map = {}; save(); tables(); };
fetch(kp("m32map")).then(r => r.json()).then(m => { map = m || {}; tables(); }).catch(() => { try { map = JSON.parse(localStorage.getItem("m32map") || "{}"); } catch (_) {} tables(); });
fetch(kp("whoami")).then(r => r.json()).then(w => { $("mode").textContent = w.mode + " · :" + w.port + " · " + w.commit; $("mode").style.color = w.mode === "LIVE" ? "#34C759" : "#FF9F0A"; }).catch(() => { $("mode").textContent = "no kernel: MIDI only"; });
(function loop() { draw(); requestAnimationFrame(loop); })();
tables();
</script>
</body>
</html>
